[project]
name = "autogen-mas"
version = "0.1.0"
description = "DAI 2026 artifact for clean and adversarial multi-agent reasoning experiments."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

[project.scripts]
autogen-mas = "autogen_mas.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autogen_mas*"]
